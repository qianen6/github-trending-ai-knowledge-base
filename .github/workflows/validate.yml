name: Validate knowledge base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate knowledge data
        run: python scripts/trending_engine.py validate --root .
      - name: Rebuild static site
        run: python scripts/build_site.py --root .
      - name: Validate static site
        run: python scripts/validate_site.py --root .
